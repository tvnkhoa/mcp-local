name: CI

# Migration-plan step S-05. Makes the gate automatic: what used to be a chain of
# commands typed by hand, covering one server, now runs on every push.
#
# Everything here is credential-free. See docs/development/ci.md for what that
# does and does not cover.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # windows-latest to match the development environment: better-sqlite3 and
    # tree-sitter build natively, and the path handling this workspace normalizes
    # is Windows-specific. A Linux matrix entry is deliberately not part of S-05.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The servers are not workspace members, so their lockfiles are not
          # covered by the root one and each needs its own cache key input.
          cache-dependency-path: |
            package-lock.json
            codebase-index-mcp/package-lock.json
            postgres-mcp/package-lock.json
            observe-mcp/package-lock.json
            bitbucket-mcp/package-lock.json

      - name: Install workspace packages
        run: npm ci

      # Must precede the server install: servers consume packages/*/dist through
      # `file:` dependencies, so the dist output has to exist first.
      - name: Build packages
        run: npm run build:packages

      - name: Install servers
        run: npm run install:servers

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Test packages
        run: npm run test:packages

      # Blocking since S-41. An `error` finding fails this step and therefore the build; there is
      # no `continue-on-error`. Five rules were flipped from warning to error in S-41 once the
      # migration had driven each to zero: env/direct-access, tier/undeclared-external,
      # package/exports-map, style/no-default-export, exemption/stale.
      #
      # Deliberately NOT `--strict`. That would also fail on warnings, and `size/soft-cap` is
      # advisory by design — 17 files sit in the 400-600 band, several because they are genuinely
      # one thing (see docs/reference/conventions.md §5). Making the soft cap blocking would force splits
      # that add indirection without making any failure easier to diagnose.
      - name: Platform guards
        run: npm run guard:all

      - name: Build servers
        run: npm run build:servers

      - name: Typecheck servers
        run: npm run typecheck:servers

      - name: Test servers
        run: npm run test:servers

      # Boots all four servers over a real stdio handshake with placeholder env
      # and diffs tools/list against the committed snapshots. This is both the
      # contract gate and the credential-free boot check — it is what catches a
      # module that compiles but cannot load.
      - name: Check tool contracts
        run: npm run contracts:check

      # Generated-file drift used to be caught locally or not at all: generate:check was in
      # verify:all but absent here, so a hand-edit to a .env.example or a README block could
      # survive a push. Cheap (pure comparison, no server started).
      - name: Check generated files
        run: npm run generate:check

      # The documentation gate (scripts/check-docs.mjs): links, documented tool arguments and
      # names, capability claims, and deprecated env names used as instructions. Every check here
      # closes a failure mode that a hand review found and no gate caught.
      - name: Check documentation
        run: npm run docs:check

      # A performance gate rather than a correctness test, so it is its own step:
      # compact-mode token savings must stay at or above 40%.
      #
      # The output is captured rather than discarded (backlog B-04). `BENCH_MIN_RESOLVED_CALL_EDGE_PCT`
      # is 60 while the observed value is 100 — a floor 40 points below observation cannot fail, and
      # raising it needs several runs' evidence rather than one measurement. Recording the number on
      # every push turns "five runs across different commits" from a chore someone has to remember
      # into something that accumulates on its own; the job summary is retained with the run.
      - name: Benchmark gate (codebase-index-mcp)
        shell: bash
        run: npm run benchmark:plan:check | tee "$RUNNER_TEMP/bench.json"
        working-directory: codebase-index-mcp

      # Hardened rather than fixed — the previous form has not been observed to fail. GitHub runs
      # `shell: bash` with `-eo pipefail`, so in `grep … | head -1 … || echo "n/a"` a SIGPIPE to
      # grep (head closes the pipe after one line) fails the pipeline and the rescue writes "n/a"
      # over a number that was there. At today's ~10KB of benchmark output grep finishes writing
      # first and it never triggers; the race only opens up as the output grows. Since this step
      # exists to accumulate a datapoint nobody watches, a wrong value is worse than no value:
      # `grep -m1` stops grep itself, and the missing-file case is now stated rather than inferred
      # from a failed pipeline.
      - name: Record the graph-accuracy observation
        if: always()
        shell: bash
        run: |
          bench="$RUNNER_TEMP/bench.json"
          field() {
            if [ ! -f "$bench" ]; then echo "n/a"; return; fi
            grep -o -m1 "\"$1\": *[0-9.]*" "$bench" | sed 's/.*: *//' || echo "n/a"
          }
          observed=$(field resolvedCallEdgePct)
          floor=$(field minResolvedCallEdgePct)
          {
            echo "## Graph accuracy (B-04 datapoint)"
            echo ""
            echo "| commit | observed \`resolvedCallEdgePct\` | floor |"
            echo "|---|---|---|"
            echo "| \`${GITHUB_SHA:0:12}\` | **${observed}** | ${floor} |"
            echo ""
            echo "Raise the floor once five observations across different commits exist — set it"
            echo "below the lowest, with the margin justified from the spread. See docs/development/backlog.md B-04."
          } >> "$GITHUB_STEP_SUMMARY"
